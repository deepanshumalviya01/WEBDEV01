<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BASIC FORM</title>
</head>
<body>
    <fieldset >
        <legend align="center">Basic Form</legend>
        <form
    <label for="fullname">Full Name :</label>
    <input type="text" name="fullname" id="fullname" placeholder="Enter Your Name">
    <br>
    <br>
    <label for="Email">E mail : </label>
    <input type="text" name="Email" id="Email" placeholder="Enter Your Email">
    <br>
    <br>
    <label for="password">Password</label>
    <input type="password" 
    name="password"
     id="password"
     placeholder="password">

     <br><br>
     <label for="cofirmpassword">confirm password</label>
     <input type="password" name="confirmpassword" id="confirmpassword" placeholder="confirm password">
     <br>
     <br>
     <label for="dob">Date Of birth   </label>
     <input type="date"
      name="dob" 
      id="dob">
      <br>
      <br>
      <label for="timeofbirth">Time Of Birth  </label>
      <input type="time" name="timeofbirth" id="timeofbirth">
     <br><br>
     <label for="joiningtime">JoiningTime   </label>
     <input type="datetime-local"
      name="joiningtime"
       id="joiningtime">
       <br><br>
    <label for="volume">volume  </label>
    <input type="range"
    name="volume"
    id="volume"
    min="0"
    max="10"
    value="3">
    <br><br>
    <label for="mobno">Mobile No  </label>
    <input type="number"
    name="mobno"
    id="mobno"
    placeholder="Enter Your Mobile Number">
    <br>
    <br>
    <label for="file">Resume</label>
    <input type="file" name="file" id="file">

    <br>
    <br>
    <label for="address">Address</label>
    <textarea name="address" id="address">Address</textarea>
    <br><br>

    <label for="course">Course :</label>
    <select name="course" id="course">
        <option value="">--select course</option>
        <option value="Btech">btech</option>
        <option value="Bba">bba</option>
        <option value="mtech">mtech</option>
        <option value="mba">mba</option>
    </select>

    <br>
    <br><label for="gender">gender :</label>
    <input type="radio" name="gender" id="male" value="male">
    <span>male</span>
    <input type="radio" name="gender" id="female" value="female">
    <span>female</span>
    <input type="radio" name="gender" id="other" value="other">
    <span>other</span>
    <br><br>

     <br><label for="skillset">skillset :</label>
    <input type="checkbox" name="skillset" id="java" value="java">
    <span>java</span>
    <input type="checkbox" name="skillset" id="dsa" value="dsa">
    <span>dsa</span>
    <input type="checkbox" name="skillset" id="html" value="html">
    <span>html</span>
    <br><br>

    <img src="" alt=""
    width=""
    height="">
     <button>submit</button>
        </form>
    </fieldset>
</body>
</html>
